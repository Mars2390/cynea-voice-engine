<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Cynea Voice Engine</title>
<meta name="description" content="Sign in to your Cynea voice agent dashboard." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  color: #1A1A1A;
  background: #F5F1EA;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── full-page subtle ambient gradient ─────────────────────────── */
.signin-bg {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(900px 500px at 30% 30%, rgba(0,212,255,0.18), transparent 60%),
    radial-gradient(800px 460px at 70% 70%, rgba(167,139,250,0.10), transparent 65%),
    #F5F1EA;
}
.signin-bg::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 700px 500px at 50% 40%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 700px 500px at 50% 40%, black 30%, transparent 80%);
  opacity: 0.6;
}

/* ── page layout ─────────────────────────────────────────────── */
.signin-page {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 20px;
  gap: 32px;
}

.signin-logo {
  display: inline-flex; align-items: baseline; gap: 12px;
  text-decoration: none;
  animation: brandGlowPulse 4.5s ease-in-out infinite;
}
.brand-mark {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 22px; letter-spacing: 0.18em;
  color: #00D4FF;
  text-shadow: 0 0 20px rgba(0,212,255,0.5);
}
.brand-tag {
  font-family: 'Syne', sans-serif; font-weight: 600;
  font-size: 11px; letter-spacing: 0.32em; color: #6B6B6B;
}
@keyframes brandGlowPulse {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(0,212,255,0.35)); }
  50%      { filter: drop-shadow(0 0 28px rgba(0,212,255,0.7)); }
}

/* ── card ─────────────────────────────────────────────────────── */
.signin-card {
  width: 100%; max-width: 420px;
  background: linear-gradient(160deg, #FFFFFF 0%, #FBF8F2 100%);
  border: 1px solid #E4DED2; border-radius: 16px;
  padding: 32px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 30px 80px rgba(0,212,255,0.10),
    0 60px 120px rgba(0,0,0,0.6);
  position: relative; overflow: hidden;
}
.signin-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,212,255,0.06), transparent 30%);
}
.signin-card h1 {
  font-family: 'Syne', sans-serif; font-weight: 700;
  font-size: 22px; margin: 0 0 6px;
  position: relative; z-index: 1;
}
.signin-card .lead {
  font-size: 13px; color: #6B6B6B; margin: 0 0 22px;
  position: relative; z-index: 1;
}

/* ── form ─────────────────────────────────────────────────────── */
.signin-form {
  display: flex; flex-direction: column; gap: 14px;
  position: relative; z-index: 1;
}
.signin-field { display: flex; flex-direction: column; gap: 6px; }
.signin-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: #6B6B6B; font-weight: 600;
}
.signin-input {
  width: 100%;
  background: #FBF8F2; color: #1A1A1A;
  border: 1px solid #E4DED2; border-radius: 10px;
  padding: 11px 14px;
  font-family: inherit; font-size: 14px;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.signin-input:focus {
  border-color: #00D4FF;
  box-shadow: 0 0 0 3px rgba(0,212,255,0.18);
}
.signin-input::placeholder { color: #9A938A; }

/* ── buttons ──────────────────────────────────────────────────── */
.btn {
  font-family: inherit; font-weight: 600; font-size: 14px;
  padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid #E4DED2; background: #FBF8F2; color: #1A1A1A;
  transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 220ms ease, filter 120ms ease, background 200ms ease;
}
.btn:hover { transform: translateY(-1px) scale(1.02); }
.btn:active { transform: translateY(0) scale(1); }
.btn-primary {
  background: #00D4FF; color: #001218; border-color: #00D4FF;
  width: 100%;
}
.btn-primary:hover { box-shadow: 0 0 0 1px #00D4FF, 0 0 28px rgba(0,212,255,0.45); }

.btn-google {
  width: 100%;
  background: #FFFFFF; color: #1F1F1F;
  border: 1px solid #FFFFFF;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px 16px;
}
.btn-google:hover { background: #1A1A1A; }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── divider ──────────────────────────────────────────────────── */
.signin-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0;
  position: relative; z-index: 1;
}
.signin-divider::before,
.signin-divider::after {
  content: ""; flex: 1; height: 1px; background: #E4DED2;
}
.signin-divider span {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
  color: #9A938A; font-weight: 600;
}

/* ── footer link ──────────────────────────────────────────────── */
.signin-aside {
  text-align: center; margin: 22px 0 0;
  font-size: 13px; color: #6B6B6B;
  position: relative; z-index: 1;
}
.signin-aside a { color: #00D4FF; text-decoration: none; font-weight: 500; }
.signin-aside a:hover { text-decoration: underline; }

.signin-page-footer {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: #9A938A; font-weight: 600;
}

/* mobile */
@media (max-width: 480px) {
  .signin-card { padding: 24px; border-radius: 14px; }
  .signin-card h1 { font-size: 19px; }
}

/* ════ CY-LIGHT — ElevenLabs-style light skin (Cynea) ════ */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
h1,h2,h3,h4{font-family:'Inter',sans-serif;letter-spacing:-0.02em;}
.brand-mark{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:0.04em;color:#1A1A1A;text-shadow:none;}
.brand-tag{color:#9A938A;}
.btn-primary{background:#0A0A0A;color:#FFFFFF;border-color:#0A0A0A;}
.btn-primary:hover{background:#222;border-color:#222;filter:none;box-shadow:0 8px 24px rgba(0,0,0,0.16);}

/* ════ CY-LIGHT · wow polish ════ */
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion:no-preference){
  body{animation:cyPageIn 0.55s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes cyPageIn{from{opacity:0;}to{opacity:1;}}
}
</style>
</head>
<body>
<div class="signin-bg" aria-hidden="true"></div>

<main class="signin-page">
  <a class="signin-logo" href="cynea_landing.html">
    <span class="brand-mark">CYNEA</span>
    <span class="brand-tag">VOICE ENGINE</span>
  </a>

  <article class="signin-card">
    <h1>Sign in to your account</h1>
    <p class="lead">Continue managing your voice agents and call operations.</p>

    <form id="signin-form" class="signin-form" autocomplete="off" novalidate>
      <label class="signin-field">
        <span class="signin-label">Email</span>
        <input class="signin-input" type="email" name="email"
               placeholder="you@company.com" autocomplete="email">
      </label>
      <label class="signin-field">
        <span class="signin-label">Password</span>
        <input class="signin-input" type="password" name="password"
               placeholder="••••••••" autocomplete="current-password">
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <div class="signin-divider"><span>or continue with</span></div>

    <button id="googleBtn" class="btn btn-google" type="button">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.79 2.71v2.26h2.9c1.7-1.56 2.69-3.86 2.69-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7a5.41 5.41 0 0 1 0-3.4V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.96L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </button>

    <p class="signin-aside">
      Don't have an account?
      <a href="cynea_landing.html#agents">Request access</a>
    </p>
  </article>

  <footer class="signin-page-footer">Cynea AI · Voice Platform for Africa</footer>
</main>

<script>
'use strict';
// Demo wiring — both the form submit and the Google button take the
// user straight to the agent manager. There is no real authentication
// happening here. A production deployment would replace these handlers
// with a real OAuth flow + session-cookie issuance.
function go() { window.location.href = 'agent_manager.html'; }

const form = document.getElementById('signin-form');
if (form) {
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    go();
  });
}
const googleBtn = document.getElementById('googleBtn');
if (googleBtn) googleBtn.addEventListener('click', go);
</script>
</body>
</html>
