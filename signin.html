<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Cynea</title>
<meta name="description" content="Sign in to Cynea — human-like AI voice agents for businesses worldwide." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* palette sampled from the reference imagery — see index.html */
  --cream:#FBF8F5;--cream-2:#F4EFE9;--surface:#FFFFFF;--surface-2:#F7F2ED;
  --ink:#171A2E;--muted:#6E6B7C;--faint:#9B98A6;--line:#E9E1D8;--black:#12142A;
  --accent:#FF6B4A;--accent-ink:#E24A2E;
  --coral:#FF6B4A;--amber:#F2A03D;--blush:#F9B3BE;--teal:#4FD1C5;--navy:#1B2050;
  --grad-dusk:linear-gradient(142deg,#1B2050 0%,#4A3A7E 34%,#B8437E 66%,#FF8A5C 100%);
  --grad-warm:linear-gradient(140deg,#FF6B4A 0%,#F2A03D 54%,#F9B3BE 100%);
  --r:18px;--r-lg:28px;--maxw:1200px}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
h1,h2,h3{letter-spacing:-.02em;font-weight:600;margin:0}.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:15px;font-weight:500;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .18s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}.btn-dark{background:var(--black);color:#fff;border-color:var(--black)}.btn-dark:hover{background:#2A2E4A;box-shadow:0 10px 28px rgba(0,0,0,.18)}

/* ── ambient drifting orbs ───────────────────────────────────── */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;opacity:.9}
.orb-cyan{width:560px;height:560px;top:-160px;left:-120px;background:radial-gradient(circle at 50% 50%,rgba(255,107,74,.22),transparent 70%);animation:drift1 26s ease-in-out infinite}
.orb-lav{width:620px;height:620px;bottom:-200px;right:-160px;background:radial-gradient(circle at 50% 50%,rgba(212,69,126,.16),transparent 70%);animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(80px,60px,0)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-70px,-50px,0)}}

/* ── page layout ─────────────────────────────────────────────── */
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:30px}

/* ── wordmark ────────────────────────────────────────────────── */
.logo{display:inline-flex;align-items:baseline;gap:11px}
.logo b{font-weight:700;font-size:24px;letter-spacing:.02em;color:var(--ink)}
.logo span{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.32em;color:var(--faint);font-weight:500}

/* ── card ────────────────────────────────────────────────────── */
.card{position:relative;width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 20px 50px rgba(0,0,0,.07),0 40px 90px rgba(255,107,74,.06);overflow:hidden;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,107,74,.55),transparent);pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card h1{font-size:23px;margin:0 0 7px}
.card .lead{font-size:14px;color:var(--muted);margin:0 0 24px}

/* ── form ────────────────────────────────────────────────────── */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.input{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(255,107,74,.22)}
.input::placeholder{color:var(--faint)}
.btn-submit{width:100%;margin-top:4px;font-size:15px;font-weight:600;padding:13px 20px;border-radius:999px}

/* ── divider ─────────────────────────────────────────────────── */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.msg{min-height:20px;margin:14px 0 0;font-size:13.5px;color:var(--muted);text-align:center}
.msg.err{color:#D9455F}
.msg.ok{color:#2E9E6B}

/* ── google btn ──────────────────────────────────────────────── */
.btn-google{width:100%;gap:10px;font-weight:500;padding:12px 18px}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

/* ── aside / footer ──────────────────────────────────────────── */
.aside{text-align:center;margin:24px 0 0;font-size:14px;color:var(--muted)}
.aside a{color:var(--accent-ink);font-weight:500}
.aside a:hover{text-decoration:underline}
.page-footer{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--faint)}

@media(max-width:480px){.card{padding:26px;border-radius:16px}.card h1{font-size:20px}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true">
  <div class="orb orb-cyan"></div>
  <div class="orb orb-lav"></div>
</div>

<main class="page">
  <a class="logo" href="index.html" aria-label="Cynea home">
    <b>CYNEA</b>
    <span>VOICE ENGINE</span>
  </a>

  <article class="card">
    <h1>Sign in to Cynea</h1>
    <p class="lead">Welcome back. Access your dashboard and manage your AI voice agents.</p>

    <form id="signin-form" class="form" autocomplete="off" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark btn-submit" id="submitBtn" type="submit">Sign in</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <p class="aside">
      Don't have an account?
      <a href="index.html#try-demo">Request access</a>
    </p>
  </article>

  <footer class="page-footer">Cynea AI · Voice agents for every market</footer>
</main>

<script>
'use strict';

/* Real authentication against POST /auth/login. This page used to call a
   go() helper that redirected to the agent manager without checking
   anything, which meant the URL alone was the credential. */

var API_BASE = (function(){
    /* Deployed, the API is /api on this same origin — same-origin means no
       CORS preflight and no hard-coded hostname to rot. Opened from a file
       or a static server on localhost there is no /api to talk to, so fall
       back to a locally-run uvicorn. Set localStorage.cynea_api to override
       either, which is what you want when pointing a local console at a
       deployed API. */
    var override = localStorage.getItem('cynea_api');
    if (override) return override.replace(/\/$/, '');
    var h = location.hostname;
    var local = (h === 'localhost' || h === '127.0.0.1' || h === '' || location.protocol === 'file:');
    return local ? 'http://127.0.0.1:8000' : '/api';
  })();

var form   = document.getElementById('signin-form');
var btn    = document.getElementById('submitBtn');
var msg    = document.getElementById('msg');
var NEXT   = new URLSearchParams(location.search).get('next') || 'dashboard.html';

function say(text, kind){
  msg.textContent = text;
  msg.className = 'msg' + (kind ? ' ' + kind : '');
}

/* Already signed in? Don't make them type it again. */
(function(){
  var token = localStorage.getItem('cynea_token');
  if (!token) return;
  fetch(API_BASE + '/auth/me', {headers:{Authorization:'Bearer ' + token}})
    .then(function(r){ if (r.ok) location.replace(NEXT); })
    .catch(function(){ /* API down; let them sign in normally */ });
})();

form.addEventListener('submit', function(e){
  e.preventDefault();
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  if (!email || !password){
    say('Enter your email and password.', 'err');
    return;
  }

  btn.disabled = true;
  say('Signing in…');

  fetch(API_BASE + '/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, password: password})
  })
  .then(function(r){
    return r.json().then(function(body){ return {ok: r.ok, status: r.status, body: body}; });
  })
  .then(function(res){
    if (res.ok){
      localStorage.setItem('cynea_token', res.body.token);
      localStorage.setItem('cynea_email', res.body.email);
      say('Signed in. Taking you through…', 'ok');
      location.replace(NEXT);
      return;
    }
    btn.disabled = false;
    /* The API returns the same message for an unknown email and a wrong
       password on purpose, so this page must not guess which it was. */
    say(res.status === 401
          ? 'Incorrect email or password.'
          : (res.body.detail || 'Sign-in failed.'), 'err');
  })
  .catch(function(){
    btn.disabled = false;
    say('Cannot reach the API at ' + API_BASE +
        '. Start it with: uvicorn cynea.api:app --port 8000', 'err');
  });
});
</script>
</body>
</html>
