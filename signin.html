<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Cynea</title>
<!-- Brand icons: the Prism mark (faceted geometric C). -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="48x48 32x32 16x16">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="mask-icon" href="assets/mask-icon.svg" color="#00D4FF">
<meta name="theme-color" content="#050505">

<meta name="description" content="Sign in to Cynea — human-like AI voice agents for businesses worldwide." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* official Cynea brand: dark ground, one cyan accent */
  --bg:#050505;--bg-2:#0E0E0E;--bg-3:#161616;--card:#111111;
  --cyan:#00D4FF;--cyan-hover:#00B8E6;--cyan-dark:#0088AA;
  --text:#F5F5F5;--text-2:#8A8A8A;--border:#1E1E1E;
  /* legacy token names, repointed so existing rules keep working */
  --cream:#050505;--cream-2:#0E0E0E;--surface:#111111;--surface-2:#161616;
  --ink:#F5F5F5;--muted:#8A8A8A;--faint:#6B6B6B;--line:#1E1E1E;--black:#00D4FF;
  --accent:#00D4FF;--accent-ink:#00D4FF;
  --ok:#3DD68C;--bad:#FF6B6B;
  --display:'Syne',system-ui,sans-serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;--r-lg:28px;--maxw:1200px}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;font-weight:700;line-height:1.08;margin:0}.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:15px;font-weight:500;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--bg-3);color:var(--ink);cursor:pointer;transition:transform .18s,box-shadow .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:#2A2A2A;background:#1A1A1A}
.btn-dark{background:var(--cyan);color:#050505;border-color:var(--cyan)}
.btn-dark:hover{background:var(--cyan-hover);border-color:var(--cyan-hover);box-shadow:0 10px 28px rgba(0,212,255,.18)}
.btn:disabled{opacity:.6;cursor:default;transform:none}

/* ── ambient drifting orbs ───────────────────────────────────── */
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;opacity:.9}
.orb-cyan{width:560px;height:560px;top:-160px;left:-120px;background:radial-gradient(circle at 50% 50%,rgba(0,212,255,.20),transparent 70%);animation:drift1 26s ease-in-out infinite}
.orb-lav{width:620px;height:620px;bottom:-200px;right:-160px;background:radial-gradient(circle at 50% 50%,rgba(0,136,170,.24),transparent 70%);animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(80px,60px,0)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-70px,-50px,0)}}

/* ── page layout ─────────────────────────────────────────────── */
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:32px}

/* ── Prism lockup ────────────────────────────────────────────── */
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
.logo .prism{color:var(--cyan);width:15px;height:26px;flex-shrink:0}
.logo b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1;color:var(--text)}

/* ── card ────────────────────────────────────────────────────── */
.card{position:relative;width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.5),0 40px 90px rgba(0,212,255,.05);overflow:hidden;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.6),transparent);pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card h1{font-size:24px;margin:0 0 8px}
.card .lead{font-size:14px;color:var(--muted);margin:0 0 24px}

/* ── form ────────────────────────────────────────────────────── */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-family:var(--sans);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.input{width:100%;background:var(--bg-3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.input:focus{border-color:var(--cyan);background:var(--bg-3);box-shadow:0 0 0 3px rgba(0,212,255,.22)}
.input::placeholder{color:var(--faint)}
.btn-submit{width:100%;margin-top:4px;font-size:15px;font-weight:600;padding:13px 20px;border-radius:999px}

/* ── divider ─────────────────────────────────────────────────── */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600}
.msg{min-height:20px;margin:16px 0 0;font-size:13.5px;color:var(--muted);text-align:center}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}

/* ── google btn ──────────────────────────────────────────────── */
.btn-google{width:100%;gap:10px;font-weight:500;padding:12px 18px;background:var(--bg-3);border-color:var(--line);color:var(--ink)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

/* ── aside / footer ──────────────────────────────────────────── */
.aside{text-align:center;margin:24px 0 0;font-size:14px;color:var(--muted)}
.aside a{color:var(--cyan);font-weight:500}
.aside a:hover{color:var(--cyan-hover);text-decoration:underline}
.page-footer{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--muted)}

@media(max-width:480px){.card{padding:24px;border-radius:16px}.card h1{font-size:21px}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true">
  <div class="orb orb-cyan"></div>
  <div class="orb orb-lav"></div>
</div>

<main class="page">
  <a class="logo" href="index.html" aria-label="Cynea home">
    <svg class="prism" viewBox="14 2 30 52" width="15" height="26" aria-hidden="true" focusable="false"><g transform="translate(2,2)"><path d="M28 2 L38 2 L40 4 L40 9 L34 15 L34 37 L40 43 L40 48 L38 50 L28 50 L18 43 L14 30 L14 22 L18 9 Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="bevel"/><path d="M22 12 L34 6 L34 15 L27 23 Z" fill="currentColor" fill-opacity=".18"/><path d="M22 40 L34 46 L34 37 L27 29 Z" fill="currentColor" fill-opacity=".09"/><circle cx="26" cy="26" r="2.5" fill="currentColor"/></g></svg>
    <b>Cynea</b>
  </a>

  <article class="card">
    <h1>Sign in to Cynea</h1>
    <p class="lead">Welcome back. Access your dashboard and manage your AI voice agents.</p>

    <form id="signin-form" class="form" autocomplete="off" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark btn-submit" id="submitBtn" type="submit">Sign in</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <p class="aside">
      Don't have an account?
      <a href="index.html#try-demo">Request access</a>
    </p>
  </article>

  <footer class="page-footer">Cynea AI · Voice agents for every market</footer>
</main>

<script>
'use strict';

/* Real authentication against POST /auth/login. This page used to call a
   go() helper that redirected to the agent manager without checking
   anything, which meant the URL alone was the credential. */

var API_BASE = (function(){
    /* Deployed, the API is /api on this same origin — same-origin means no
       CORS preflight and no hard-coded hostname to rot. Opened from a file
       or a static server on localhost there is no /api to talk to, so fall
       back to a locally-run uvicorn. Set localStorage.cynea_api to override
       either, which is what you want when pointing a local console at a
       deployed API. */
    var override = localStorage.getItem('cynea_api');
    if (override) return override.replace(/\/$/, '');
    var h = location.hostname;
    var local = (h === 'localhost' || h === '127.0.0.1' || h === '' || location.protocol === 'file:');
    return local ? 'http://127.0.0.1:8000' : '/api';
  })();

var form   = document.getElementById('signin-form');
var btn    = document.getElementById('submitBtn');
var msg    = document.getElementById('msg');
var NEXT   = new URLSearchParams(location.search).get('next') || 'dashboard.html';

function say(text, kind){
  msg.textContent = text;
  msg.className = 'msg' + (kind ? ' ' + kind : '');
}

/* Already signed in? Don't make them type it again. */
(function(){
  var token = localStorage.getItem('cynea_token');
  if (!token) return;
  fetch(API_BASE + '/auth/me', {headers:{Authorization:'Bearer ' + token}})
    .then(function(r){ if (r.ok) location.replace(NEXT); })
    .catch(function(){ /* API down; let them sign in normally */ });
})();

form.addEventListener('submit', function(e){
  e.preventDefault();
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  if (!email || !password){
    say('Enter your email and password.', 'err');
    return;
  }

  btn.disabled = true;
  say('Signing in…');

  fetch(API_BASE + '/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, password: password})
  })
  .then(function(r){
    return r.json().then(function(body){ return {ok: r.ok, status: r.status, body: body}; });
  })
  .then(function(res){
    if (res.ok){
      localStorage.setItem('cynea_token', res.body.token);
      localStorage.setItem('cynea_email', res.body.email);
      say('Signed in. Taking you through…', 'ok');
      location.replace(NEXT);
      return;
    }
    btn.disabled = false;
    /* The API returns the same message for an unknown email and a wrong
       password on purpose, so this page must not guess which it was. */
    say(res.status === 401
          ? 'Incorrect email or password.'
          : (res.body.detail || 'Sign-in failed.'), 'err');
  })
  .catch(function(){
    btn.disabled = false;
    say('Cannot reach the API at ' + API_BASE +
        '. Start it with: uvicorn cynea.api:app --port 8000', 'err');
  });
});
</script>
</body>
</html>
