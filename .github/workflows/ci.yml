name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the deploy target (see Dockerfile); 3.13 catches
        # deprecations before they become breakage.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify every provider registers
        # Catches the class of bug this suite was written after: a provider
        # module that exists but is never imported, so the registry never
        # sees it and get_*_provider() raises at call time.
        run: |
          python - <<'PY'
          import cynea
          reg = cynea.providers.registered()
          print("registered:", reg)
          missing = []
          if "groq" not in reg["llm"]:        missing.append("llm:groq")
          if "anthropic" not in reg["llm"]:   missing.append("llm:anthropic")
          if "elevenlabs" not in reg["tts"]:  missing.append("tts:elevenlabs")
          if "edge_tts" not in reg["tts"]:    missing.append("tts:edge_tts")
          if "whisper" not in reg["stt"]:     missing.append("stt:whisper")
          if missing:
              raise SystemExit(f"providers failed to register: {missing}")
          PY

      - name: Verify all four personas load
        run: |
          python - <<'PY'
          import cynea
          from cynea.agent_loader import _PERSONAS
          found = sorted(_PERSONAS)
          print("personas:", found)
          expected = {"amina", "kofi", "kwame", "maya"}
          if not expected.issubset(found):
              raise SystemExit(f"missing personas: {sorted(expected - set(found))}")
          PY

      - name: Run tests
        env:
          # Tests use a temp SQLite file; no Postgres service needed.
          DATABASE_URL: "sqlite:///ci.db"
        run: pytest tests/ -v --tb=short

      - name: Schema creates cleanly
        env:
          DATABASE_URL: "sqlite:///ci_migrate.db"
        run: python -m cynea.migrate

  build:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Default build only (WITH_WHISPER=0). The Whisper variant pulls
      # ~2 GB of torch, which is not worth doing on every push.
      - name: Build image
        run: docker build -t cynea:${{ github.sha }} .

      - name: Providers register inside the image
        run: |
          docker run --rm cynea:${{ github.sha }} \
            python -c "import cynea; print(cynea.providers.registered())"
